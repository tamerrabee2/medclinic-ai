version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medclinic-postgres
    environment:
      POSTGRES_DB: medclinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: medclinic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medclinic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medclinic-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DATABASE_CONNECTION_STRING=Host=postgres;Port=5432;Database=medclinic;Username=postgres;Password=medclinic_password
      - REDIS_CONNECTION_STRING=redis:6379
      - JWT_SECRET=dev_secret_key_please_change_in_production_32+
      - JWT_ISSUER=MedClinicAI
      - JWT_AUDIENCE=MedClinicAI
      - AI_PROVIDER=mock
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_PATH=/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medclinic-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
