name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-and-test:
    name: Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medclinic_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MedClinic.sln

      - name: Build Solution
        run: dotnet build MedClinic.sln --no-restore -c Release

      - name: Strict Package Vulnerabilities Check
        run: dotnet list package --vulnerable --include-transitive

      - name: Run Backend Tests with Coverage
        run: dotnet test MedClinic.sln --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage"
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=medclinic_test;Username=postgres;Password=postgres"
          Jwt__Key: "CI_TEST_KEY_MUST_BE_AT_LEAST_32_CHARS_LONG_123456"
          Jwt__Secret: "CI_TEST_KEY_MUST_BE_AT_LEAST_32_CHARS_LONG_123456"

  frontend-build-and-e2e:
    name: Frontend Build, Lint & Playwright E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright Test Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, frontend-build-and-e2e]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t medclinic-api:${{ github.sha }} .
